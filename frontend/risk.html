    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes pulse-warn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50%      { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(245,158,11,0.08);
            padding-left: 16px;
        }
        .pulse-warn { animation: pulse-warn 2s infinite; }
    </style>

    <script>
        let activeOnly = false;

        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            await loadRiskData();
        });

        function toggleActiveFilter() {
            activeOnly = !activeOnly;
            const btn = document.getElementById("btnActiveFilter");
            if (activeOnly) {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>僅活躍代理`;
                btn.className = "px-3 py-2 border border-amber-500/30 rounded-xl text-sm text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 transition-all font-medium flex items-center gap-1.5";
            } else {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>全部代理`;
                btn.className = "px-3 py-2 border border-slate-700 rounded-xl text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all font-medium flex items-center gap-1.5";
            }
            loadRiskData();
        }

        function riskColorClasses(level) {
            switch (level) {
                case "低風險": return { badge: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20", bar: "bg-emerald-500", dot: "bg-emerald-500" };
                case "中風險": return { badge: "bg-amber-500/10 text-amber-400 border-amber-500/20", bar: "bg-amber-500", dot: "bg-amber-500" };
                case "高風險": return { badge: "bg-red-500/10 text-red-400 border-red-500/20", bar: "bg-red-500", dot: "bg-red-500 pulse-warn" };
                default: return { badge: "bg-slate-800 text-slate-400 border-slate-700", bar: "bg-slate-600", dot: "bg-slate-600" };
            }
        }

        function scoreBarColor(score) {
            if (score >= 75) return "bg-emerald-500";
            if (score >= 50) return "bg-amber-500";
            return "bg-red-500";
        }

        function severityBadge(score) {
            if (score >= 70) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-red-500/10 text-red-400">高</span>`;
            if (score >= 40) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400">中</span>`;
            return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-700 text-slate-300">低</span>`;
        }

        async function loadRiskData() {
            const days = document.getElementById("riskDays").value;

            // Reset overview
            document.getElementById("overviewAnomalyCount").textContent = "-";
            document.getElementById("overviewHighRisk").textContent = "-";
            document.getElementById("overviewTotalChecked").textContent = "-";

            // Show skeletons
            document.getElementById("riskReportCards").innerHTML = '<div class="space-y-3"><div class="skeleton h-20 w-full"></div><div class="skeleton h-20 w-full"></div><div class="skeleton h-20 w-full"></div></div>';
            document.getElementById("anomalyTable").innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center"><div class="skeleton h-4 w-56 mx-auto"></div></td></tr>';
            document.getElementById("anomalyLabel").textContent = "載入中...";

            try {
                // 並行請求
                const [anomalyData, riskData] = await Promise.all([
                    apiRequest(`/analysis/anomalies?days=${days}`),
                    apiRequest(`/analysis/risk-report?days=${days}&active_only=${activeOnly}`)
                ]);

                // 更新總覽
                document.getElementById("overviewAnomalyCount").textContent = anomalyData.anomaly_count;
                document.getElementById("overviewTotalChecked").textContent = anomalyData.total_checked;
                document.getElementById("anomalyLabel").textContent = `Isolation Forest · 檢測 ${anomalyData.total_checked} 筆`;

                const reports = riskData.reports || [];
                const highRiskCount = reports.filter(r => r.risk_level === "高風險").length;
                document.getElementById("overviewHighRisk").textContent = highRiskCount;

                // 渲染代理評分卡片
                const cardsDiv = document.getElementById("riskReportCards");
                if (reports.length === 0) {
                    cardsDiv.innerHTML = renderEmptyState("暫無風控數據", "尚無足夠交易記錄進行評分");
                } else {
                    cardsDiv.innerHTML = reports.map(r => {
                        const colors = riskColorClasses(r.risk_level);
                        const d = r.details || {};
                        return `
                            <div class="border border-slate-800 rounded-xl p-5 hover:shadow-sm transition-shadow">
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2.5 h-2.5 rounded-full ${colors.dot} shrink-0"></div>
                                        <span class="font-bold text-slate-100">${r.agent_name}</span>
                                        <span class="px-2 py-0.5 rounded-full text-xs font-semibold border ${colors.badge}">${r.risk_level}</span>
                                    </div>
                                    <span class="text-2xl font-extrabold text-slate-200">${r.score}<span class="text-sm font-normal text-slate-500">/100</span></span>
                                </div>
                                <!-- 評分進度條 -->
                                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden mb-3">
                                    <div class="h-full ${scoreBarColor(r.score)} rounded-full transition-all duration-700 ease-out" style="width: ${r.score}%"></div>
                                </div>
                                <!-- 評分細節 -->
                                <div class="grid grid-cols-3 gap-2 text-xs text-slate-400">
                                    <div class="bg-slate-800 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-slate-500">交易筆數</span>
                                        <span class="font-semibold text-slate-300">${d.transaction_count || 0}</span>
                                    </div>
                                    <div class="bg-slate-800 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-slate-500">總金額</span>
                                        <span class="font-semibold text-slate-300">${formatEarnings(d.currency_breakdown)}</span>
                                    </div>
                                    <div class="bg-slate-800 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-slate-500">異常率</span>
                                        <span class="font-semibold ${(d.anomaly_rate || 0) > 5 ? 'text-red-400' : 'text-slate-300'}">${d.anomaly_rate || 0}%</span>
                                    </div>
                                </div>
                                <!-- 子評分 -->
                                <div class="flex gap-4 mt-3 pt-3 border-t border-gray-50 text-xs text-slate-500">
                                    <span>交易量：<b class="text-slate-400">${d.volume_score || 0}/30</b></span>
                                    <span>穩定性：<b class="text-slate-400">${d.stability_score || 0}/40</b></span>
                                    <span>異常控制：<b class="text-slate-400">${d.anomaly_score || 0}/30</b></span>
                                </div>
                            </div>
                        `;
                    }).join("");
                }

                // 渲染異常交易表格
                const tableBody = document.getElementById("anomalyTable");
                const anomalies = anomalyData.anomalies || [];
                if (anomalies.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-14">${renderEmptyState("未檢測到異常交易", anomalyData.total_checked > 0 ? `已檢測 ${anomalyData.total_checked} 筆交易，均屬正常範圍` : "尚無交易數據")}</td></tr>`;
                } else {
                    // 按異常分數降序排列
                    anomalies.sort((a, b) => b.anomaly_score - a.anomaly_score);
                    tableBody.innerHTML = anomalies.map((tx, i) => `
                        <tr class="hover:bg-slate-800/50 transition-colors animate-fade-in-up" style="animation-delay: ${i * 0.04}s">
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm text-slate-400">${utcToHKTime(tx.timestamp)}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm font-semibold text-slate-200">${tx.agent_name}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm text-slate-300">${tx.customer_name || "-"}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm font-bold text-red-400 text-right">${formatCurrency(tx.amount, tx.currency || 'USD')}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm text-center">
                                <div class="inline-flex items-center gap-2">
                                    ${severityBadge(tx.anomaly_score)}
                                    <span class="font-mono text-xs font-semibold text-slate-400">${tx.anomaly_score}</span>
                                </div>
                            </td>
                        </tr>
                    `).join("");
                }

            } catch (error) {
                console.error("加載風控數據失敗：", error);
                document.getElementById("riskReportCards").innerHTML = '<p class="text-center text-red-400 text-sm py-6">載入失敗，請稍後重試</p>';
                document.getElementById("anomalyTable").innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-red-400 text-sm">載入失敗，請稍後重試</td></tr>';
            }
        }
    </script>
</body>
</html>
