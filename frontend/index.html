<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理交易管理系統 - 登錄</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入公共工具 -->
    <script src="utils.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">代理交易管理系統</h1>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2 font-medium">用戶名</label>
                <input 
                    type="text" 
                    id="username" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="請輸入用戶名"
                    required
                >
            </div>
            
            <div>
                <label class="block text-gray-700 mb-2 font-medium">密碼</label>
                <input 
                    type="password" 
                    id="password" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="請輸入密碼"
                    required
                >
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium"
            >
                登錄
            </button>
        </form>
        
        <p id="errorMessage" class="text-red-500 mt-4 text-center hidden"></p>
    </div>

    <script>
        // 如果已經登錄，直接跳轉到儀表盤
        if (isLoggedIn()) {
            window.location.href = "dashboard.html";
        }

        // 處理登錄表單提交
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");
            
            try {
                // 構建表單數據（後端OAuth2要求用form-data格式）
                const formData = new FormData();
                formData.append("username", username);
                formData.append("password", password);
                
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: "POST",
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error("用戶名或密碼錯誤");
                }
                
                const data = await response.json();
                setToken(data.access_token);
                
                // 登錄成功，跳轉到儀表盤
                window.location.href = "dashboard.html";
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
