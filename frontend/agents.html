<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理管理 - 代理交易管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="utils.js"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .sidebar-link {
            transition: all 0.15s ease;
        }
        .sidebar-link:hover {
            background-color: #eff6ff;
            padding-left: 16px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-blue-50/30 to-gray-100 min-h-screen">

    <!-- 頂部導航欄 -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-blue-700 rounded-lg flex items-center justify-center shadow-md shadow-blue-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                    </svg>
                </div>
                <h1 class="text-lg font-bold text-gray-800 tracking-tight">代理交易管理系統</h1>
            </div>
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-emerald-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-sm">A</div>
                <span class="text-sm text-gray-600 font-medium">管理員</span>
                <button onclick="logout()" class="text-sm bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-lg hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all duration-150 font-medium">登出</button>
            </div>
        </div>
    </nav>

    <!-- 側邊欄和主內容 -->
    <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">
        <!-- 側邊欄 -->
        <aside class="w-52 shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 sticky top-24">
                <ul class="space-y-1">
                    <li>
                        <a href="dashboard.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            <span>儀表盤</span>
                        </a>
                    </li>
                    <li>
                        <a href="transactions.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                            <span>交易記錄</span>
                        </a>
                    </li>
                    <li>
                        <a href="agents.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-semibold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>代理管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="reports.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>報表下載</span>
                        </a>
                    </li>
                    <li>
                        <a href="risk.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span>風險監控</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-6 animate-fade-in-up" style="animation-delay: 0s;">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">代理管理</h2>
                    <p class="text-sm text-gray-500 mt-1" id="agentCount">管理代理帳戶與手續費率</p>
                </div>
                <button
                    onclick="openAddAgentModal()"
                    class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-4 py-2.5 rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all text-sm font-semibold shadow-md shadow-blue-500/25 hover:shadow-lg hover:shadow-blue-500/30 active:scale-[0.98] flex items-center space-x-1.5"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    <span>添加代理</span>
                </button>
            </div>

            <!-- 代理列表表格 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden animate-fade-in-up" style="animation-delay: 0.1s;">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50/80">
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">代理名稱</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">手續費率</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">累計收益</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">狀態</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="agentTable" class="divide-y divide-gray-100">
                        <tr class="skeleton-row"><td colspan="5" class="px-6 py-3.5"><div class="skeleton h-4 w-48 mx-auto"></div></td></tr>
                        <tr class="skeleton-row"><td colspan="5" class="px-6 py-3.5"><div class="skeleton h-4 w-56 mx-auto"></div></td></tr>
                        <tr class="skeleton-row"><td colspan="5" class="px-6 py-3.5"><div class="skeleton h-4 w-40 mx-auto"></div></td></tr>
                        <tr class="skeleton-row"><td colspan="5" class="px-6 py-3.5"><div class="skeleton h-4 w-52 mx-auto"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 添加代理模態框 -->
    <div id="addAgentModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md animate-fade-in-up">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-gray-800">添加新代理</h3>
                <button onclick="closeAddAgentModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="addAgentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">代理名稱</label>
                    <input
                        type="text"
                        id="agentName"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition-all"
                        placeholder="請輸入代理名稱"
                        required
                    >
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">手續費率（例如：0.05 表示 5%）</label>
                    <input
                        type="number"
                        id="commissionRate"
                        step="0.01" min="0" max="1" value="0.05"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition-all"
                        required
                    >
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeAddAgentModal()" class="px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
                    <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all text-sm font-semibold shadow-md shadow-blue-500/25">確認添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 修改手續費模態框 -->
    <div id="editCommissionModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md animate-fade-in-up">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-gray-800">修改手續費率</h3>
                <button onclick="closeEditCommissionModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors text-gray-400 hover:text-gray-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="editCommissionForm" class="space-y-4">
                <input type="hidden" id="editAgentName">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">代理名稱</label>
                    <p id="editAgentNameDisplay" class="text-sm font-semibold text-gray-900 bg-gray-50 rounded-xl px-4 py-2.5"></p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">新手續費率</label>
                    <input
                        type="number"
                        id="editCommissionRate"
                        step="0.01" min="0" max="1"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition-all"
                        required
                    >
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeEditCommissionModal()" class="px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
                    <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all text-sm font-semibold shadow-md shadow-blue-500/25">確認修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            await loadAgents();
        });

        async function loadAgents() {
            const tableBody = document.getElementById("agentTable");

            try {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center">${renderSkeleton(4, "h-8")}</td></tr>`;

                const agents = await apiRequest("/agents/");
                document.getElementById("agentCount").textContent = `共 ${agents.length} 位代理`;

                if (agents.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10">${renderEmptyState("暫無代理", "點擊右上角按鈕添加第一位代理")}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                agents.forEach(agent => {
                    const row = document.createElement("tr");
                    row.className = "hover:bg-gray-50/50 transition-colors";
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900">${agent.agent_name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            <span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-lg text-xs font-semibold">${(agent.commission_rate * 100).toFixed(1)}%</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-emerald-600">${formatEarnings(agent.total_earnings)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                <span>啟用</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-1">
                            <button onclick="openEditCommissionModal('${agent.agent_name}', ${agent.commission_rate})" class="text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg transition-colors text-xs font-semibold">修改手續費</button>
                            <button onclick="deleteAgent('${agent.agent_name}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-2.5 py-1.5 rounded-lg transition-colors text-xs font-semibold">刪除</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-red-500 text-sm">載入失敗，請稍後重試</td></tr>`;
                console.error("加載代理列表失敗：", error);
            }
        }

        // ==================== 添加代理 ====================
        function openAddAgentModal() {
            document.getElementById("addAgentModal").classList.remove("hidden");
            document.getElementById("agentName").focus();
        }

        function closeAddAgentModal() {
            document.getElementById("addAgentModal").classList.add("hidden");
            document.getElementById("addAgentForm").reset();
        }

        document.getElementById("addAgentForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const agentName = document.getElementById("agentName").value;
            const commissionRate = parseFloat(document.getElementById("commissionRate").value);
            const submitBtn = e.target.querySelector('button[type="submit"]');

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "添加中...";
                await apiRequest("/agents/", "POST", { agent_name: agentName, commission_rate: commissionRate });
                closeAddAgentModal();
                await loadAgents();
                showToast("代理添加成功", "success");
            } catch (error) {
                showToast("添加失敗：" + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "確認添加";
            }
        });

        // ==================== 修改手續費 ====================
        function openEditCommissionModal(agentName, currentRate) {
            document.getElementById("editAgentName").value = agentName;
            document.getElementById("editAgentNameDisplay").textContent = agentName;
            document.getElementById("editCommissionRate").value = currentRate;
            document.getElementById("editCommissionModal").classList.remove("hidden");
            document.getElementById("editCommissionRate").focus();
        }

        function closeEditCommissionModal() {
            document.getElementById("editCommissionModal").classList.add("hidden");
        }

        document.getElementById("editCommissionForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const agentName = document.getElementById("editAgentName").value;
            const newRate = parseFloat(document.getElementById("editCommissionRate").value);
            const submitBtn = e.target.querySelector('button[type="submit"]');

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "修改中...";
                await apiRequest(`/agents/${encodeURIComponent(agentName)}/commission?commission_rate=${newRate}`, "PUT");
                closeEditCommissionModal();
                await loadAgents();
                showToast("手續費率修改成功", "success");
            } catch (error) {
                showToast("修改失敗：" + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "確認修改";
            }
        });

        // ==================== 刪除代理 ====================
        async function deleteAgent(agentName) {
            if (!confirm(`確定要刪除代理「${agentName}」嗎？此操作不可撤銷。`)) return;
            try {
                await apiRequest(`/agents/${encodeURIComponent(agentName)}`, "DELETE");
                await loadAgents();
                showToast("代理刪除成功", "success");
            } catch (error) {
                showToast("刪除失敗：" + error.message, "error");
            }
        }
    </script>
</body>
</html>
