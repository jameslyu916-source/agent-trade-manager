<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理管理 - 代理交易管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="utils.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 頂部導航欄 -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">代理交易管理系統</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-600">管理員</span>
                <button 
                    onclick="logout()" 
                    class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition-colors"
                >
                    登出
                </button>
            </div>
        </div>
    </nav>

    <!-- 側邊欄和主內容 -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex">
        <!-- 側邊欄 -->
        <div class="w-48 bg-white rounded-lg shadow-md p-4 mr-6">
            <ul class="space-y-2">
                <li>
                    <a href="dashboard.html" class="block px-3 py-2 rounded hover:bg-gray-100 transition-colors">
                        📊 儀表盤
                    </a>
                </li>
                <li>
                    <a href="transactions.html" class="block px-3 py-2 rounded hover:bg-gray-100 transition-colors">
                        📝 交易記錄
                    </a>
                </li>
                <li>
                    <a href="agents.html" class="block px-3 py-2 rounded bg-blue-100 text-blue-700 font-medium">
                        👥 代理管理
                    </a>
                </li>
                <li>
                    <a href="reports.html" class="block px-3 py-2 rounded hover:bg-gray-100 transition-colors">
                        📑 報表下載
                    </a>
                </li>
            </ul>
        </div>

        <!-- 主內容區 -->
        <div class="flex-1">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">代理管理</h2>
                <button 
                    onclick="openAddAgentModal()" 
                    class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors"
                >
                    + 添加代理
                </button>
            </div>

            <!-- 代理列表表格 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">代理名稱</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">手續費率</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">累計收益</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">狀態</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="agentTable" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-500">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加代理模態框 -->
    <div id="addAgentModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4 text-gray-800">添加新代理</h3>
            <form id="addAgentForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">代理名稱</label>
                    <input 
                        type="text" 
                        id="agentName" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="請輸入代理名稱"
                        required
                    >
                </div>
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">手續費率（例如：0.05 表示5%）</label>
                    <input 
                        type="number" 
                        id="commissionRate" 
                        step="0.01" 
                        min="0" 
                        max="1" 
                        value="0.05"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>
                <div class="flex justify-end space-x-2">
                    <button 
                        type="button" 
                        onclick="closeAddAgentModal()" 
                        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors"
                    >
                        取消
                    </button>
                    <button 
                        type="submit" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                    >
                        確認添加
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 修改手續費模態框 -->
    <div id="editCommissionModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4 text-gray-800">修改手續費率</h3>
            <form id="editCommissionForm" class="space-y-4">
                <input type="hidden" id="editAgentName">
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">代理名稱</label>
                    <p id="editAgentNameDisplay" class="text-gray-900 font-medium"></p>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">新手續費率</label>
                    <input 
                        type="number" 
                        id="editCommissionRate" 
                        step="0.01" 
                        min="0" 
                        max="1"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>
                <div class="flex justify-end space-x-2">
                    <button 
                        type="button" 
                        onclick="closeEditCommissionModal()" 
                        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors"
                    >
                        取消
                    </button>
                    <button 
                        type="submit" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                    >
                        確認修改
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 頁面加載時檢查權限並加載數據
        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            await loadAgents();
        });

        // 加載代理列表
        async function loadAgents() {
            const tableBody = document.getElementById("agentTable");
            
            try {
                tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">載入中...</td></tr>';
                
                const agents = await apiRequest("/agents/");
                
                if (agents.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">暫無代理</td></tr>';
                    return;
                }
                
                // 渲染表格
                tableBody.innerHTML = "";
                agents.forEach(agent => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${agent.agent_name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${(agent.commission_rate * 100).toFixed(1)}%</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600">${formatHKD(agent.total_earnings)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                啟用
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button 
                                onclick="openEditCommissionModal('${agent.agent_name}', ${agent.commission_rate})" 
                                class="text-blue-600 hover:text-blue-900 mr-4"
                            >
                                修改手續費
                            </button>
                            <button 
                                onclick="deleteAgent('${agent.agent_name}')" 
                                class="text-red-600 hover:text-red-900"
                            >
                                刪除
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
                
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">載入失敗，請稍後重試</td></tr>';
                console.error("加載代理列表失敗：", error);
            }
        }

        // ==================== 添加代理相關 ====================
        function openAddAgentModal() {
            document.getElementById("addAgentModal").classList.remove("hidden");
        }

        function closeAddAgentModal() {
            document.getElementById("addAgentModal").classList.add("hidden");
            document.getElementById("addAgentForm").reset();
        }

        document.getElementById("addAgentForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const agentName = document.getElementById("agentName").value;
            const commissionRate = parseFloat(document.getElementById("commissionRate").value);
            
            try {
                await apiRequest("/agents/", "POST", {
                    agent_name: agentName,
                    commission_rate: commissionRate
                });
                
                closeAddAgentModal();
                await loadAgents();
                alert("代理添加成功");
                
            } catch (error) {
                alert("添加失敗：" + error.message);
            }
        });

        // ==================== 修改手續費相關 ====================
        function openEditCommissionModal(agentName, currentRate) {
            document.getElementById("editAgentName").value = agentName;
            document.getElementById("editAgentNameDisplay").textContent = agentName;
            document.getElementById("editCommissionRate").value = currentRate;
            document.getElementById("editCommissionModal").classList.remove("hidden");
        }

        function closeEditCommissionModal() {
            document.getElementById("editCommissionModal").classList.add("hidden");
        }

        document.getElementById("editCommissionForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const agentName = document.getElementById("editAgentName").value;
            const newRate = parseFloat(document.getElementById("editCommissionRate").value);
            
            try {
                await apiRequest(`/agents/${encodeURIComponent(agentName)}/commission?commission_rate=${newRate}`, "PUT");
                
                closeEditCommissionModal();
                await loadAgents();
                alert("手續費率修改成功");
                
            } catch (error) {
                alert("修改失敗：" + error.message);
            }
        });

        // ==================== 刪除代理 ====================
        async function deleteAgent(agentName) {
            if (!confirm(`確定要刪除代理 "${agentName}" 嗎？此操作不可撤銷。`)) {
                return;
            }
            
            try {
                await apiRequest(`/agents/${encodeURIComponent(agentName)}`, "DELETE");
                await loadAgents();
                alert("代理刪除成功");
                
            } catch (error) {
                alert("刪除失敗：" + error.message);
            }
        }
    </script>
</body>
</html>
