<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶帳戶 - LINKBIZ GLOBAL TradeManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }
        }
      }
    </script>
    <script src="utils.js?v=4"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .sidebar-link {
            transition: background-color 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(245,158,11,0.08);
            padding-left: 16px;
        }
        .table-row {
            transition: background-color 0.12s ease;
        }
        .table-row:hover {
            background-color: rgba(30,41,59,0.5);
        }
    </style>
</head>

            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-amber-500 to-amber-600 rounded-lg flex items-center justify-center shadow-md shadow-amber-500/20"><svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg></div>
                <h1 class="text-lg font-bold text-slate-100 tracking-tight">TradeManager</h1>
            </div>
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-amber-400 to-amber-500 rounded-full flex items-center justify-center text-slate-900 text-xs font-bold shadow-sm">A</div>
                <span class="text-sm text-slate-400 font-medium">管理員</span>
                <button onclick="logout()" class="text-sm bg-slate-800 border border-slate-700 text-slate-300 px-3.5 py-1.5 rounded-lg hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/30 transition-all duration-200 font-medium">登出</button>
            </div>
        </div>

                <ul class="space-y-1">

                <h2 class="text-2xl font-bold text-slate-100">客戶帳戶</h2>

                </div>
            </div>

            <!-- 統計卡片 -->
            <div class="grid grid-cols-3 gap-4 mb-5" id="statsCards">

                    <div class="text-xs text-slate-400 mb-1">多帳戶客戶</div>
                    <div class="text-2xl font-bold text-amber-400" id="statMultiAccount">-</div>

            </div>

            <!-- 結果表格 -->

                        <div class="skeleton h-5 w-full"></div>
                        <div class="skeleton h-5 w-full"></div>
                        <div class="skeleton h-5 w-2/3"></div>

                </div>

                <div class="overflow-x-auto hidden" id="resultTable">

                        <thead class="text-xs text-slate-400 uppercase bg-slate-800/50">

                                <th class="px-4 py-3 font-semibold whitespace-nowrap">銀行帳號</th>

                                <th class="px-3 py-3 font-semibold whitespace-nowrap">首次記錄</th>

                                <th class="px-3 py-3 font-semibold text-right whitespace-nowrap">使用次數</th>
                                <th class="px-4 py-3 font-semibold text-right whitespace-nowrap">操作</th>

    <!-- 客戶詳情 Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] overflow-hidden animate-fade-in-up">

                <h3 class="text-lg font-bold text-slate-100" id="modalTitle">客戶帳戶歷史</h3>
                <button onclick="closeDetailModal()" class="text-slate-500 hover:text-slate-300 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]" id="modalContent">
                <div class="text-center text-slate-500 py-8">載入中…</div>
            </div>
        </div>
    </div>

    <!-- 編輯 Modal -->
    <div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-lg animate-fade-in-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100">編輯客戶帳戶</h3>
                <button onclick="closeEditModal()" class="text-slate-500 hover:text-slate-300 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">客戶名稱</label>
                    <input type="text" id="editName" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">銀行帳號</label>
                    <input type="text" id="editAccount" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 font-mono focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">銀行名稱</label>
                    <input type="text" id="editBank" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-400">
                </div>
                <div class="grid grid-cols-3 gap-3 text-xs text-slate-500">
                    <div>首次記錄：<span id="editFirstSeen" class="text-slate-400">-</span></div>
                    <div>最近記錄：<span id="editLastSeen" class="text-slate-400">-</span></div>
                    <div>使用次數：<span id="editTxCount" class="text-slate-400">-</span></div>
                </div>
                <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
                    <button onclick="closeEditModal()" class="px-4 py-2 text-sm bg-slate-800 border border-slate-700 text-slate-300 rounded-lg hover:bg-slate-700 transition-colors">取消</button>
                    <button onclick="saveEdit()" class="px-4 py-2 text-sm bg-amber-500 text-slate-900 font-semibold rounded-lg hover:bg-amber-400 transition-colors">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];
        let searchTimeout = null;

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("searchInput").addEventListener("input", onSearchInput);
            loadAll();
        });

        async function loadAll() {
            showSkeleton();
            try {
                allResults = await apiRequest("/customer-accounts/");
                document.getElementById("statTotal").textContent = allResults.length;
                renderResults(allResults);
            } catch (e) {
                showToast("載入失敗：" + (e.message || e), "error");
                showEmpty();
            }
        }

        function onSearchInput() {
            clearTimeout(searchTimeout);
            const q = document.getElementById("searchInput").value.trim();
            if (!q) { loadAll(); return; }
            searchTimeout = setTimeout(() => doSearch(q), 300);
        }

        async function doSearch(q) {
            showSkeleton();
            try {
                allResults = await apiRequest(`/customer-accounts/?q=${encodeURIComponent(q)}`);
                renderResults(allResults);
            } catch (e) {
                showToast("搜尋失敗：" + (e.message || e), "error");
                showEmpty();
            }
        }

        function renderResults(results) {
            const tbody = document.getElementById("tableBody");
            const skeleton = document.getElementById("skeletonTable");
            const table = document.getElementById("resultTable");
            const empty = document.getElementById("emptyState");

            skeleton.classList.add("hidden");

            if (!results || results.length === 0) {
                table.classList.add("hidden");
                empty.classList.remove("hidden");
                document.getElementById("statResults").textContent = "0";
                document.getElementById("statMultiAccount").textContent = "-";
                return;
            }

            empty.classList.add("hidden");
            table.classList.remove("hidden");

            const nameCounts = {};
            results.forEach(r => { nameCounts[r.customer_name] = (nameCounts[r.customer_name] || 0) + 1; });
            const multiAccountCustomers = new Set();
            results.forEach(r => { if (nameCounts[r.customer_name] > 1) multiAccountCustomers.add(r.customer_name); });

            document.getElementById("statResults").textContent = results.length;
            document.getElementById("statMultiAccount").textContent = multiAccountCustomers.size;

            tbody.innerHTML = results.map((r, i) => {
                const firstSeen = r.first_seen ? new Date(r.first_seen).toLocaleDateString("zh-HK", { year: "numeric", month: "short", day: "numeric" }) : "-";
                const lastSeen = r.last_seen ? new Date(r.last_seen).toLocaleDateString("zh-HK", { year: "numeric", month: "short", day: "numeric" }) : "-";
                const style = `style="animation-delay:${i * 0.03}s"`;
                return `<tr class="table-row animate-fade-in-up" ${style}>
                    <td class="px-4 py-3 font-medium text-slate-200 cursor-pointer hover:text-amber-400 transition-colors" onclick="openDetail('${encodeURIComponent(r.customer_name)}')">${escapeHtml(r.customer_name)}</td>
                    <td class="px-4 py-3 font-mono text-slate-300">${escapeHtml(r.account_number)}</td>
                    <td class="px-4 py-3 text-slate-400">${escapeHtml(r.bank_name || "-")}</td>
                    <td class="px-3 py-3 text-slate-400 text-xs">${firstSeen}</td>
                    <td class="px-3 py-3 text-slate-400 text-xs">${lastSeen}</td>
                    <td class="px-3 py-3 text-right text-slate-300">${r.transaction_count}</td>
                    <td class="px-4 py-3 text-right whitespace-nowrap">
                        <button onclick="event.stopPropagation();openEdit(${r.id})" class="text-xs px-2.5 py-1 bg-blue-500/10 text-blue-400 rounded-md hover:bg-blue-500/20 transition-colors mr-1">編輯</button>
                        <button onclick="event.stopPropagation();deleteAccount(${r.id},'${escapeHtml(r.customer_name).replace(/'/g, "\\'")}')" class="text-xs px-2.5 py-1 bg-red-500/10 text-red-400 rounded-md hover:bg-red-500/20 transition-colors">刪除</button>
                    </td>
                </tr>`;
            }).join("");
        }

        function showSkeleton() {
            document.getElementById("skeletonTable").classList.remove("hidden");
            document.getElementById("resultTable").classList.add("hidden");
            document.getElementById("emptyState").classList.add("hidden");
        }

        function showEmpty() {
            document.getElementById("skeletonTable").classList.add("hidden");
            document.getElementById("resultTable").classList.add("hidden");
            document.getElementById("emptyState").classList.remove("hidden");
            document.getElementById("statResults").textContent = "-";
            document.getElementById("statMultiAccount").textContent = "-";
        }

        // ── 編輯 ──

        function openEdit(id) {
            const r = allResults.find(a => a.id === id);
            if (!r) return showToast("找不到該記錄", "error");
            document.getElementById("editId").value = r.id;
            document.getElementById("editName").value = r.customer_name;
            document.getElementById("editAccount").value = r.account_number;
            document.getElementById("editBank").value = r.bank_name || "";
            document.getElementById("editFirstSeen").textContent = r.first_seen ? new Date(r.first_seen).toLocaleDateString("zh-HK") : "-";
            document.getElementById("editLastSeen").textContent = r.last_seen ? new Date(r.last_seen).toLocaleDateString("zh-HK") : "-";
            document.getElementById("editTxCount").textContent = r.transaction_count;
            const modal = document.getElementById("editModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeEditModal() {
            const modal = document.getElementById("editModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        async function saveEdit() {
            const id = document.getElementById("editId").value;
            const customer_name = document.getElementById("editName").value.trim();
            const account_number = document.getElementById("editAccount").value.trim();
            const bank_name = document.getElementById("editBank").value.trim();

            if (!customer_name) return showToast("客戶名稱不能為空", "error");
            if (!account_number) return showToast("銀行帳號不能為空", "error");

            try {
                await apiRequest(`/customer-accounts/${id}`, "PUT", { customer_name, account_number, bank_name });
                showToast("已儲存", "success");
                closeEditModal();
                // 根據當前搜尋狀態刷新
                const q = document.getElementById("searchInput").value.trim();
                if (q) await doSearch(q); else await loadAll();
            } catch (e) {
                showToast("儲存失敗：" + (e.message || e), "error");
            }
        }

        document.getElementById("editModal").addEventListener("click", function(e) {
            if (e.target === this) closeEditModal();
        });

        // ── 刪除 ──

        async function deleteAccount(id, name) {
            if (!confirm(`確定要刪除客戶「${name}」的這筆帳戶記錄嗎？`)) return;
            try {
                await apiRequest(`/customer-accounts/${id}`, "DELETE");
                showToast("已刪除", "success");
                const q = document.getElementById("searchInput").value.trim();
                if (q) await doSearch(q); else await loadAll();
            } catch (e) {
                showToast("刪除失敗：" + (e.message || e), "error");
            }
        }

        // ── 客戶詳情 ──

        async function openDetail(customerName) {
            const modal = document.getElementById("detailModal");
            const content = document.getElementById("modalContent");
            document.getElementById("modalTitle").textContent = decodeURIComponent(customerName) + " — 帳戶歷史";
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            content.innerHTML = `<div class="text-center text-slate-500 py-8">
                <div class="skeleton h-4 w-3/4 mx-auto mb-2"></div>
                <div class="skeleton h-4 w-1/2 mx-auto mb-2"></div>
                <div class="skeleton h-4 w-2/3 mx-auto"></div>
            </div>`;

            try {
                const results = await apiRequest(`/customer-accounts/by-name/${encodeURIComponent(customerName)}`);
                if (!results || results.length === 0) {
                    content.innerHTML = `<div class="text-center text-slate-500 py-8">暫無帳戶記錄</div>`;
                    return;
                }
                content.innerHTML = `
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-800/50">
                            <tr>
                                <th class="px-4 py-2 font-semibold">銀行帳號</th>
                                <th class="px-4 py-2 font-semibold">銀行名稱</th>
                                <th class="px-4 py-2 font-semibold">首次記錄</th>
                                <th class="px-4 py-2 font-semibold">最近記錄</th>
                                <th class="px-4 py-2 font-semibold text-right">使用次數</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${results.map(r => {
                                const firstSeen = r.first_seen ? new Date(r.first_seen).toLocaleDateString("zh-HK", { year: "numeric", month: "short", day: "numeric" }) : "-";
                                const lastSeen = r.last_seen ? new Date(r.last_seen).toLocaleDateString("zh-HK", { year: "numeric", month: "short", day: "numeric" }) : "-";
                                return `<tr>
                                    <td class="px-4 py-3 font-mono text-slate-200">${escapeHtml(r.account_number)}</td>
                                    <td class="px-4 py-3 text-slate-400">${escapeHtml(r.bank_name || "-")}</td>
                                    <td class="px-4 py-3 text-slate-400">${firstSeen}</td>
                                    <td class="px-4 py-3 text-slate-400">${lastSeen}</td>
                                    <td class="px-4 py-3 text-right text-slate-300">${r.transaction_count}</td>
                                </tr>`;
                            }).join("")}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                content.innerHTML = `<div class="text-center text-red-400 py-8">載入失敗：${escapeHtml(e.message || e)}</div>`;
            }
        }

        function closeDetailModal() {
            const modal = document.getElementById("detailModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        document.getElementById("detailModal").addEventListener("click", function(e) {
            if (e.target === this) closeDetailModal();
        });

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
