    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }

    <script src="utils.js?v=3"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50%      { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out both;
        }
        .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 24px -4px rgba(245,158,11,0.15);
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(245,158,11,0.08);
            padding-left: 16px;
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            setWelcomeDate();
            await loadDashboardData();
        });

        function setWelcomeDate() {
            const now = new Date();
            const options = { year: "numeric", month: "long", day: "numeric", weekday: "long", timeZone: "Asia/Hong_Kong" };
            document.getElementById("welcomeDate").textContent = now.toLocaleDateString("zh-HK", options);
        }

        function medalIcon(index) {
            if (index === 0) return `<span class="text-lg">🥇</span>`;
            if (index === 1) return `<span class="text-lg">🥈</span>`;
            if (index === 2) return `<span class="text-lg">🥉</span>`;
            return `<span class="w-6 h-6 inline-flex items-center justify-center rounded-full bg-slate-800 text-slate-500 text-xs font-bold">${index + 1}</span>`;
        }

        function rankBarColor(index) {
            if (index === 0) return "bg-gradient-to-r from-amber-400 to-amber-300";
            if (index === 1) return "bg-gradient-to-r from-slate-400 to-slate-300";
            if (index === 2) return "bg-gradient-to-r from-amber-600 to-amber-500";
            return "bg-gradient-to-r from-slate-600 to-slate-500";
        }

        async function loadDashboardData() {
            try {
                const [dailyStats, agentStatsRaw, transactions] = await Promise.all([
                    apiRequest("/transactions/daily"),
                    apiRequest("/transactions/daily-summary"),
                    apiRequest("/transactions/list")
                ]);

                // 載入今日匯率
                loadExchangeRates();

                // 更新統計卡片 — 總成交額按貨幣分類顯示
                document.getElementById("totalAmount").innerHTML = formatCurrencyBreakdown(dailyStats.currency_breakdown);
                document.getElementById("totalProfit").innerHTML = formatCurrencyBreakdown(dailyStats.currency_breakdown, 'profit');
                document.getElementById("transactionCount").textContent = dailyStats.transaction_count;

                // 代理排名 - 排序（按各貨幣加總，主要用於排序）
                const agentStats = agentStatsRaw.map(s => ({
                    name: s.agent_name,
                    amount: s.total_amount,
                    breakdown: s.currency_breakdown || {}
                }));
                agentStats.sort((a, b) => b.amount - a.amount);
                const maxAmount = agentStats.length > 0 ? agentStats[0].amount : 1;

                const rankingDiv = document.getElementById("agentRanking");
                if (agentStats.length === 0) {
                    rankingDiv.innerHTML = renderEmptyState("暫無排名數據", "今日尚無代理交易記錄");
                } else {
                    rankingDiv.innerHTML = agentStats.map((agent, i) => {
                        const pct = maxAmount > 0 ? (agent.amount / maxAmount * 100) : 0;
                        // 多貨幣時顯示分類，單一貨幣直接顯示
                        const currencies = Object.keys(agent.breakdown);
                        const amountDisplay = currencies.length > 1
                            ? currencies.map(c => `${agent.breakdown[c].amount.toLocaleString('zh-HK')} <span class="text-xs text-slate-500">${c}</span>`).join(' <span class="text-slate-600">|</span> ')
                            : `<span class="font-bold">${agent.amount.toLocaleString('zh-HK')}</span> <span class="text-xs text-slate-500">${currencies[0] || ''}</span>`;
                        return `
                            <div class="flex items-center space-x-3 py-2.5 px-3 rounded-lg hover:bg-slate-800/50 transition-colors">
                                <div class="shrink-0">${medalIcon(i)}</div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-baseline mb-1">
                                        <span class="text-sm font-semibold text-slate-200 truncate">${agent.name}</span>
                                        <span class="text-sm text-slate-300 ml-2 shrink-0">${amountDisplay}</span>
                                    </div>
                                    <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                        <div class="h-full ${rankBarColor(i)} rounded-full transition-all duration-700 ease-out" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join("");
                }

                // 最近 5 筆交易
                const recentTxDiv = document.getElementById("recentTransactions");
                const recentTx = transactions.slice(0, 5);
                if (recentTx.length === 0) {
                    recentTxDiv.innerHTML = renderEmptyState("暫無交易記錄", "今日尚無交易數據");
                } else {
                    recentTxDiv.innerHTML = recentTx.map(tx => {
                        const cust = tx.customer_name || "";
                        return `
                        <div class="flex items-center justify-between py-3 px-3 rounded-lg hover:bg-slate-800/50 transition-colors">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-9 h-9 bg-gradient-to-br from-amber-500/20 to-amber-500/10 rounded-lg flex items-center justify-center shrink-0">
                                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"/>
                                    </svg>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-sm font-semibold text-slate-200 truncate">${tx.agent_name}${cust ? ` <span class="text-xs text-slate-500">→ ${cust}</span>` : ""}</p>
                                    <p class="text-xs text-slate-500">${utcToHKTime(tx.timestamp)}</p>
                                </div>
                            </div>
                            <span class="text-sm font-bold text-amber-400 shrink-0 ml-3">${formatCurrency(tx.amount, tx.currency || 'USD')}</span>
                        </div>
                    `;}).join("");
                }

            } catch (error) {
                console.error("加載儀表盤數據失敗：", error);
            }

            // 異步加載風險摘要（不阻塞主數據）
            loadRiskSummary();
        }

        async function loadRiskSummary() {
            try {
                const [anomalyData, riskData] = await Promise.all([
                    apiRequest("/analysis/anomalies?days=7"),
                    apiRequest("/analysis/risk-report?days=30")
                ]);
                document.getElementById("riskAnomalyCount").textContent = anomalyData.anomaly_count || 0;
                const reports = riskData.reports || [];
                const highRisk = reports.filter(r => r.risk_level === "高風險").length;
                document.getElementById("riskHighRiskCount").textContent = highRisk;
                const lowest = reports.length > 0 ? Math.min(...reports.map(r => r.score)) : "-";
                document.getElementById("riskLowestScore").textContent = lowest !== "-" ? `${lowest} 分` : "-";
            } catch (e) {
                console.error("加載風險摘要失敗：", e);
                document.getElementById("riskAnomalyCount").textContent = "N/A";
                document.getElementById("riskHighRiskCount").textContent = "N/A";
                document.getElementById("riskLowestScore").textContent = "N/A";
            }
        }

        async function loadExchangeRates() {
            try {
                const rates = await apiRequest("/exchange-rates/");
                const usdEl = document.getElementById("rateCnyUsd");
                const hkdEl = document.getElementById("rateCnyHkd");

                if (rates && rates.length > 0) {
                    const usdRate = rates.find(r => r.to_currency === "USD");
                    const hkdRate = rates.find(r => r.to_currency === "HKD");
                    usdEl.textContent = usdRate ? usdRate.rate.toFixed(3) : "--";
                    hkdEl.textContent = hkdRate ? hkdRate.rate.toFixed(3) : "--";
                } else {
                    usdEl.textContent = "--";
                    hkdEl.textContent = "--";
                }
            } catch (e) {
                console.error("加載匯率失敗：", e);
                document.getElementById("rateCnyUsd").textContent = "--";
                document.getElementById("rateCnyHkd").textContent = "--";
            }
        }

    </script>
</body>
</html>
