<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風險監控 - 代理交易管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="utils.js?v=2"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes pulse-warn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50%      { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .sidebar-link {
            transition: all 0.15s ease;
        }
        .sidebar-link:hover {
            background-color: #eff6ff;
            padding-left: 16px;
        }
        .pulse-warn { animation: pulse-warn 2s infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-blue-50/30 to-gray-100 min-h-screen">

    <!-- 頂部導航欄 -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-blue-700 rounded-lg flex items-center justify-center shadow-md shadow-blue-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                    </svg>
                </div>
                <h1 class="text-lg font-bold text-gray-800 tracking-tight">代理交易管理系統</h1>
            </div>
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-emerald-400 to-emerald-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-sm">A</div>
                <span class="text-sm text-gray-600 font-medium">管理員</span>
                <button onclick="logout()" class="text-sm bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-lg hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all duration-150 font-medium">登出</button>
            </div>
        </div>
    </nav>

    <!-- 側邊欄和主內容 -->
    <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">
        <!-- 側邊欄 -->
        <aside class="w-52 shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 sticky top-24">
                <ul class="space-y-1">
                    <li>
                        <a href="dashboard.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            <span>儀表盤</span>
                        </a>
                    </li>
                    <li>
                        <a href="transactions.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                            <span>交易記錄</span>
                        </a>
                    </li>
                    <li>
                        <a href="agents.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>代理管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="reports.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>報表下載</span>
                        </a>
                    </li>
                    <li>
                        <a href="risk.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-semibold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span>風險監控</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 min-w-0">

            <!-- 頁面標題 -->
            <div class="flex justify-between items-center mb-6 animate-fade-in-up">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">風險監控</h2>
                    <p class="text-sm text-gray-500 mt-1">AI 異常交易偵測與代理風控評分</p>
                </div>
                <div class="flex items-center gap-2">
                    <select id="riskDays" onchange="loadRiskData()" class="px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 bg-white">
                        <option value="7">近 7 天</option>
                        <option value="14">近 14 天</option>
                        <option value="30" selected>近 30 天</option>
                    </select>
                    <button onclick="loadRiskData()" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-4 py-2 rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all text-sm font-semibold shadow-md shadow-blue-500/25 flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        更新分析
                    </button>
                </div>
            </div>

            <!-- 總覽統計卡 -->
            <div id="overviewCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 animate-fade-in-up" style="animation-delay: 0.05s;">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-gray-500">異常交易數</p>
                        <p id="overviewAnomalyCount" class="text-xl font-bold text-gray-900">-</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-gray-500">高風險代理</p>
                        <p id="overviewHighRisk" class="text-xl font-bold text-gray-900">-</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-gray-500">檢測交易總數</p>
                        <p id="overviewTotalChecked" class="text-xl font-bold text-gray-900">-</p>
                    </div>
                </div>
            </div>

            <!-- 代理風控評分 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 animate-fade-in-up" style="animation-delay: 0.1s;">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-base font-bold text-gray-800">代理風控評分</h3>
                    <span class="text-xs text-gray-400 bg-gray-50 px-2.5 py-1 rounded-full">AI 評分模型</span>
                </div>
                <div id="riskReportCards" class="space-y-4">
                    <div class="space-y-3">
                        <div class="skeleton h-20 w-full"></div>
                        <div class="skeleton h-20 w-full"></div>
                        <div class="skeleton h-20 w-full"></div>
                    </div>
                </div>
            </div>

            <!-- 異常交易列表 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden animate-fade-in-up" style="animation-delay: 0.15s;">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="text-base font-bold text-gray-800">異常交易記錄</h3>
                    <span id="anomalyLabel" class="text-xs text-gray-400 bg-gray-50 px-2.5 py-1 rounded-full">Isolation Forest 偵測</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50/80">
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">時間</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">代理</th>
                                <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">金額</th>
                                <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">異常分數</th>
                            </tr>
                        </thead>
                        <tbody id="anomalyTable" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="px-6 py-14 text-center"><div class="skeleton h-4 w-48 mx-auto"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            await loadRiskData();
        });

        function riskColorClasses(level) {
            switch (level) {
                case "低風險": return { badge: "bg-emerald-50 text-emerald-700 border-emerald-200", bar: "bg-emerald-500", dot: "bg-emerald-500" };
                case "中風險": return { badge: "bg-amber-50 text-amber-700 border-amber-200", bar: "bg-amber-500", dot: "bg-amber-500" };
                case "高風險": return { badge: "bg-red-50 text-red-700 border-red-200", bar: "bg-red-500", dot: "bg-red-500 pulse-warn" };
                default: return { badge: "bg-gray-50 text-gray-500 border-gray-200", bar: "bg-gray-400", dot: "bg-gray-400" };
            }
        }

        function scoreBarColor(score) {
            if (score >= 75) return "bg-emerald-500";
            if (score >= 50) return "bg-amber-500";
            return "bg-red-500";
        }

        function severityBadge(score) {
            if (score >= 70) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">高</span>`;
            if (score >= 40) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700">中</span>`;
            return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-700">低</span>`;
        }

        async function loadRiskData() {
            const days = document.getElementById("riskDays").value;

            // Reset overview
            document.getElementById("overviewAnomalyCount").textContent = "-";
            document.getElementById("overviewHighRisk").textContent = "-";
            document.getElementById("overviewTotalChecked").textContent = "-";

            // Show skeletons
            document.getElementById("riskReportCards").innerHTML = '<div class="space-y-3"><div class="skeleton h-20 w-full"></div><div class="skeleton h-20 w-full"></div><div class="skeleton h-20 w-full"></div></div>';
            document.getElementById("anomalyTable").innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center"><div class="skeleton h-4 w-56 mx-auto"></div></td></tr>';
            document.getElementById("anomalyLabel").textContent = "載入中...";

            try {
                // 並行請求
                const [anomalyData, riskData] = await Promise.all([
                    apiRequest(`/analysis/anomalies?days=${days}`),
                    apiRequest(`/analysis/risk-report?days=${days}`)
                ]);

                // 更新總覽
                document.getElementById("overviewAnomalyCount").textContent = anomalyData.anomaly_count;
                document.getElementById("overviewTotalChecked").textContent = anomalyData.total_checked;
                document.getElementById("anomalyLabel").textContent = `Isolation Forest · 檢測 ${anomalyData.total_checked} 筆`;

                const reports = riskData.reports || [];
                const highRiskCount = reports.filter(r => r.risk_level === "高風險").length;
                document.getElementById("overviewHighRisk").textContent = highRiskCount;

                // 渲染代理評分卡片
                const cardsDiv = document.getElementById("riskReportCards");
                if (reports.length === 0) {
                    cardsDiv.innerHTML = renderEmptyState("暫無風控數據", "尚無足夠交易記錄進行評分");
                } else {
                    cardsDiv.innerHTML = reports.map(r => {
                        const colors = riskColorClasses(r.risk_level);
                        const d = r.details || {};
                        return `
                            <div class="border border-gray-100 rounded-xl p-5 hover:shadow-sm transition-shadow">
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2.5 h-2.5 rounded-full ${colors.dot} shrink-0"></div>
                                        <span class="font-bold text-gray-800">${r.agent_name}</span>
                                        <span class="px-2 py-0.5 rounded-full text-xs font-semibold border ${colors.badge}">${r.risk_level}</span>
                                    </div>
                                    <span class="text-2xl font-extrabold text-gray-900">${r.score}<span class="text-sm font-normal text-gray-400">/100</span></span>
                                </div>
                                <!-- 評分進度條 -->
                                <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden mb-3">
                                    <div class="h-full ${scoreBarColor(r.score)} rounded-full transition-all duration-700 ease-out" style="width: ${r.score}%"></div>
                                </div>
                                <!-- 評分細節 -->
                                <div class="grid grid-cols-3 gap-2 text-xs text-gray-500">
                                    <div class="bg-gray-50 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-gray-400">交易筆數</span>
                                        <span class="font-semibold text-gray-700">${d.transaction_count || 0}</span>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-gray-400">總金額</span>
                                        <span class="font-semibold text-gray-700">${(d.total_amount || 0).toLocaleString()}</span>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg px-3 py-2 text-center">
                                        <span class="block text-gray-400">異常率</span>
                                        <span class="font-semibold ${(d.anomaly_rate || 0) > 5 ? 'text-red-600' : 'text-gray-700'}">${d.anomaly_rate || 0}%</span>
                                    </div>
                                </div>
                                <!-- 子評分 -->
                                <div class="flex gap-4 mt-3 pt-3 border-t border-gray-50 text-xs text-gray-400">
                                    <span>交易量：<b class="text-gray-600">${d.volume_score || 0}/30</b></span>
                                    <span>穩定性：<b class="text-gray-600">${d.stability_score || 0}/40</b></span>
                                    <span>異常控制：<b class="text-gray-600">${d.anomaly_score || 0}/30</b></span>
                                </div>
                            </div>
                        `;
                    }).join("");
                }

                // 渲染異常交易表格
                const tableBody = document.getElementById("anomalyTable");
                const anomalies = anomalyData.anomalies || [];
                if (anomalies.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-14">${renderEmptyState("未檢測到異常交易", anomalyData.total_checked > 0 ? `已檢測 ${anomalyData.total_checked} 筆交易，均屬正常範圍` : "尚無交易數據")}</td></tr>`;
                } else {
                    // 按異常分數降序排列
                    anomalies.sort((a, b) => b.anomaly_score - a.anomaly_score);
                    tableBody.innerHTML = anomalies.map((tx, i) => `
                        <tr class="hover:bg-gray-50/50 transition-colors animate-fade-in-up" style="animation-delay: ${i * 0.04}s">
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm text-gray-600">${utcToHKTime(tx.timestamp)}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm font-semibold text-gray-900">${tx.agent_name}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm font-bold text-red-600 text-right">${formatHKD(tx.amount)}</td>
                            <td class="px-6 py-3.5 whitespace-nowrap text-sm text-center">
                                <div class="inline-flex items-center gap-2">
                                    ${severityBadge(tx.anomaly_score)}
                                    <span class="font-mono text-xs font-semibold text-gray-600">${tx.anomaly_score}</span>
                                </div>
                            </td>
                        </tr>
                    `).join("");
                }

            } catch (error) {
                console.error("加載風控數據失敗：", error);
                document.getElementById("riskReportCards").innerHTML = '<p class="text-center text-red-500 text-sm py-6">載入失敗，請稍後重試</p>';
                document.getElementById("anomalyTable").innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-red-500 text-sm">載入失敗，請稍後重試</td></tr>';
            }
        }
    </script>
</body>
</html>
