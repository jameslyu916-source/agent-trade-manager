<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeManager Pro - 登錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }
        }
      }
    </script>
    <script src="utils.js"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out both; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .login-card {
            transition: box-shadow 0.3s ease;
        }
        .login-card:focus-within {
            box-shadow: 0 20px 50px -12px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans antialiased">

    <!-- 背景裝飾 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-amber-500/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md animate-fade-in-up" style="animation-delay: 0s;">
        <!-- Logo 區域 -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-amber-500 to-amber-600 rounded-2xl shadow-xl shadow-amber-500/20 mb-4 animate-float">
                <svg class="w-8 h-8 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-100 tracking-tight">TradeManager <span class="text-amber-400">Pro</span></h1>
            <p class="text-sm text-slate-400 mt-1.5">請登錄以繼續使用</p>
        </div>

        <!-- 登錄卡片 -->
        <div class="login-card bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 p-8">
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">用戶名</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="username"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500/50 transition-all"
                            placeholder="請輸入用戶名"
                            required
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">密碼</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500/50 transition-all"
                            placeholder="請輸入密碼"
                            required
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 py-2.5 rounded-xl hover:from-amber-400 hover:to-amber-500 transition-all font-semibold text-sm shadow-md shadow-amber-500/20 hover:shadow-lg hover:shadow-amber-500/30 active:scale-[0.98]"
                >
                    登錄
                </button>
            </form>

            <p id="errorMessage" class="text-red-400 text-sm mt-5 text-center hidden bg-red-500/10 rounded-lg py-2.5 px-3 border border-red-500/20"></p>
        </div>

        <p class="text-center text-xs text-slate-600 mt-6">Telegram Bot 交易管理後台 v2.0</p>
    </div>

    <script>
        if (isLoggedIn()) {
            window.location.href = "dashboard.html";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");
            const submitBtn = e.target.querySelector('button[type="submit"]');

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "登錄中...";
                errorMessage.classList.add("hidden");

                const formData = new FormData();
                formData.append("username", username);
                formData.append("password", password);

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("用戶名或密碼錯誤");
                }

                const data = await response.json();
                setToken(data.access_token);
                window.location.href = "dashboard.html";

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "登錄";
            }
        });
    </script>
</body>
</html>
