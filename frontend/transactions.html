<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易記錄 - TradeManager Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }
        }
      }
    </script>
    <script src="utils.js?v=3"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 800px 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(245,158,11,0.08);
            padding-left: 16px;
        }
        .table-row {
            transition: background-color 0.12s ease;
        }
        .table-row:hover {
            background-color: rgba(30,41,59,0.5);
        }
        input[type="date"] {
            color-scheme: dark;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen font-sans antialiased">

    <!-- 頂部導航欄 -->
    <nav class="bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-gradient-to-br from-amber-500 to-amber-600 rounded-lg flex items-center justify-center shadow-md shadow-amber-500/20">
                    <svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                    </svg>
                </div>
                <h1 class="text-lg font-bold text-slate-100 tracking-tight">TradeManager <span class="text-amber-400">Pro</span></h1>
            </div>
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-amber-400 to-amber-500 rounded-full flex items-center justify-center text-slate-900 text-xs font-bold shadow-sm">A</div>
                <span class="text-sm text-slate-400 font-medium">管理員</span>
                <button onclick="logout()" class="text-sm bg-slate-800 border border-slate-700 text-slate-300 px-3.5 py-1.5 rounded-lg hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/30 transition-all duration-200 font-medium">登出</button>
            </div>
        </div>
    </nav>

    <!-- 側邊欄和主內容 -->
    <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">
        <!-- 側邊欄 -->
        <aside class="w-52 shrink-0">
            <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-3 sticky top-24">
                <ul class="space-y-1">
                    <li>
                        <a href="dashboard.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            <span>儀表盤</span>
                        </a>
                    </li>
                    <li>
                        <a href="transactions.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-amber-500/10 text-amber-400 font-semibold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                            <span>交易記錄</span>
                        </a>
                    </li>
                    <li>
                        <a href="orders.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>客戶訂單</span>
                        </a>
                    </li>
                    <li>
                        <a href="agents.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>代理管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="reports.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>報表下載</span>
                        </a>
                    </li>
                    <li>
                        <a href="risk.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span>風險監控</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html" class="sidebar-link flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>系統設置</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 min-w-0">

            <!-- 頁面標題區 -->
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6 animate-fade-in-up">
                <div>
                    <h2 class="text-2xl font-bold text-slate-100">交易記錄</h2>
                    <p id="txCount" class="text-sm text-slate-500 mt-1">查詢代理交易明細</p>
                </div>
                <div class="flex items-center gap-2">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <input
                            type="date"
                            id="dateFilter"
                            class="pl-10 pr-4 py-2.5 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500/50 transition-all bg-slate-800 shadow-sm"
                        >
                    </div>
                    <button
                        onclick="loadTransactions()"
                        class="bg-gradient-to-r from-amber-500 to-amber-600 text-white px-5 py-2.5 rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all text-sm font-semibold shadow-md shadow-amber-500/20 hover:shadow-lg hover:shadow-blue-500/30 active:scale-[0.98] flex items-center gap-1.5"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        查詢
                    </button>
                </div>
            </div>

            <!-- 摘要統計卡片 -->
            <div id="summaryCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 animate-fade-in-up" style="animation-delay: 0.05s;">
                <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-500">交易筆數</p>
                        <p id="summaryCount" class="text-xl font-bold text-slate-200">-</p>
                    </div>
                </div>
                <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-500">總交易金額</p>
                        <p id="summaryAmount" class="text-xl font-bold text-slate-200">-</p>
                    </div>
                </div>
                <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-500">總盈利</p>
                        <p id="summaryProfit" class="text-xl font-bold text-slate-200">-</p>
                    </div>
                </div>
            </div>

            <!-- 交易記錄表格 -->
            <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 overflow-hidden animate-fade-in-up" style="animation-delay: 0.1s;">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-slate-800/80">
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">時間</th>
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">代理名稱</th>
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">客戶名稱</th>
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">匹配訂單</th>
                                <th class="px-6 py-3.5 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">兌換</th>
                                <th class="px-6 py-3.5 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">交易金額</th>
                                <th class="px-6 py-3.5 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">盈利</th>
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">備註</th>
                                <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">投保人</th>
                                <th class="px-6 py-3.5 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">數據來源</th>
                                <th class="px-6 py-3.5 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTable" class="divide-y divide-gray-100">
                            <!-- 初始骨架屏 - 靜態 HTML -->
                            <tr class="skeleton-row">
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-36"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-14 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-24 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-12"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-8 mx-auto"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-32"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-28 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-14 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-8 mx-auto"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-40"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-24"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-24 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-8 mx-auto"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-34"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-18"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-22 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-18 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-16 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-8 mx-auto"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-36"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-26 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-14 mx-auto"></div></td>
                                <td class="px-6 py-3.5"><div class="skeleton h-4 w-8 mx-auto"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 編輯交易彈窗 -->
            <div id="editModal" class="fixed inset-0 z-[9999] hidden items-center justify-center" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);">
                <div class="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto animate-fade-in-up">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
                        <h3 class="text-lg font-bold text-slate-100">編輯交易記錄</h3>
                        <button onclick="closeEditModal()" class="text-slate-500 hover:text-slate-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <form id="editForm" class="px-6 py-4 space-y-4">
                        <input type="hidden" id="editTxId">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">代理名稱</label>
                                <input type="text" id="editAgentName" required class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">客戶名稱</label>
                                <input type="text" id="editCustomerName" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">貨幣</label>
                                <select id="editCurrency" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">
                                    <option value="USD">USD</option><option value="HKD">HKD</option><option value="CNY">CNY</option>
                                    <option value="EUR">EUR</option><option value="GBP">GBP</option><option value="JPY">JPY</option>
                                    <option value="AUD">AUD</option><option value="SGD">SGD</option><option value="CAD">CAD</option>
                                    <option value="CHF">CHF</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">兌換來源</label>
                                <select id="editFromCurrency" class="w-full px-3 py-2 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">

            <!-- 分頁控制 -->

                    <button id="nextPage" class="px-4 py-2 border border-slate-700 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">下一頁</button>

    <script>
        const PAGE_SIZE = 20;
        let allTransactions = [];
        let currentOrders = [];

        function renderCurrencyIcon(cur) {
            const icons = {
                CNY: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#dc2626" stroke="#f87171" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="9" font-weight="700">¥</text></svg>`,
                HKD: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#b45309" stroke="#fbbf24" stroke-width="0.5"/><text x="8" y="10.5" text-anchor="middle" fill="white" font-size="6.5" font-weight="800">HK</text></svg>`,
                USD: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#15803d" stroke="#4ade80" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="9" font-weight="700">$</text></svg>`,
                USDT: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#0d9488" stroke="#2dd4bf" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="9" font-weight="700">₮</text></svg>`,
                EUR: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#1e40af" stroke="#60a5fa" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="9" font-weight="700">€</text></svg>`,
                GBP: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#7c3aed" stroke="#c084fc" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="9" font-weight="700">£</text></svg>`,
                JPY: `<svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#9d174d" stroke="#f472b6" stroke-width="0.5"/><text x="8" y="11.5" text-anchor="middle" fill="white" font-size="8" font-weight="700">円</text></svg>`,
            };
            if (icons[cur]) return icons[cur];
            // fallback: emoji for less common currencies
            const fallback = { AUD: '🇦🇺', SGD: '🇸🇬', CAD: '🇨🇦', CHF: '🇨🇭' };
            return fallback[cur] ? `<span class="text-sm">${fallback[cur]}</span>` : `<span class="text-[10px] font-bold text-slate-500">${cur}</span>`;
        }

        function renderExchangePair(from, to) {
            if (!from || !to) return '<span class="text-slate-600">-</span>';
            return `<span class="inline-flex items-center gap-1.5 bg-gradient-to-r from-slate-800/80 to-slate-800/40 px-2.5 py-1 rounded-lg border border-slate-700/50">
                ${renderCurrencyIcon(from)}<span class="text-xs font-medium text-slate-300">${from}</span>
                <span class="text-slate-600 text-[10px] mx-0.5">→</span>
                ${renderCurrencyIcon(to)}<span class="text-xs font-medium text-slate-300">${to}</span>
            </span>`;
        }

        function renderExchangeWithConversion(tx) {
            // 嘗試解析 payment_details 中的換匯信息
            let conv = null;
            try {
                const pd = typeof tx.payment_details === "string" ? JSON.parse(tx.payment_details) : (tx.payment_details || {});
                if (pd.conversion && pd.conversion.source_amount) {
                    conv = pd.conversion;
                }
            } catch (e) {}

            const toCur = tx.currency || "USD";

            if (conv) {
                const srcAmt = Math.round(conv.source_amount).toLocaleString("zh-HK");
                const srcCur = conv.source_currency || "CNY";
                return `<div class="flex flex-col items-center gap-0.5">
                    <span class="text-[10px] text-amber-400 font-medium whitespace-nowrap">${srcAmt} ${srcCur} / ${conv.rate}</span>
                    <span class="inline-flex items-center gap-1 bg-gradient-to-r from-slate-800/80 to-slate-800/40 px-2 py-0.5 rounded-lg border border-slate-700/50">
                        ${renderCurrencyIcon(srcCur)}<span class="text-[10px] font-medium text-slate-400">→</span>${renderCurrencyIcon(toCur)}
                    </span>
                </div>`;
            }

            if (tx.from_currency && tx.to_currency) {
                return renderExchangePair(tx.from_currency, tx.to_currency);
            }
            return '<span class="text-slate-600">-</span>';
        }

        function renderMatchedOrder(tx) {
            if (tx.matched_order) {
                const mo = tx.matched_order;
                return `<span class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded text-xs font-medium" title="已匹配訂單 #${mo.id}">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    ${escapeHtml(mo.customer_name)} ¥${mo.amount.toLocaleString()}
                </span>`;
            }
            return '<span class="text-slate-600">-</span>';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            checkAuth();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("dateFilter").value = today;
            await loadTransactions();
        });

        async function loadTransactions() {
            const date = document.getElementById("dateFilter").value;
            const tableBody = document.getElementById("transactionTable");

            // 顯示骨架屏
            document.querySelectorAll(".skeleton-row").forEach(r => r.style.display = "");
            document.getElementById("pagination").classList.add("hidden");
            document.getElementById("summaryCount").textContent = "-";
            document.getElementById("summaryAmount").textContent = "-";
            document.getElementById("summaryProfit").textContent = "-";

            try {
                let url = "/transactions/list";
                if (date) url += `?date=${date}`;

                allTransactions = await apiRequest(url);
                // 同時加載當天訂單
                try {
                    const orderUrl = `/orders/daily?date=${date}`;
                    currentOrders = await apiRequest(orderUrl);
                } catch (_) { currentOrders = []; }
                document.getElementById("txCount").textContent = `共 ${allTransactions.length} 筆交易`;

                // 更新摘要卡片 — 按貨幣分類
                document.getElementById("summaryCount").textContent = allTransactions.length;

                const currencyTotals = {};
                const currencyProfits = {};
                for (const tx of allTransactions) {
                    const cur = tx.currency || "USD";
                    if (!currencyTotals[cur]) { currencyTotals[cur] = 0; currencyProfits[cur] = 0; }
                    currencyTotals[cur] += tx.amount;
                    currencyProfits[cur] += (tx.profit || 0);
                }
                const sortedCurrencies = Object.keys(currencyTotals).sort((a, b) => (a !== "USD" ? 1 : -1));
                const amountHtml = sortedCurrencies
                    .map(cur => `<span class="text-xs font-medium text-slate-500">${cur}</span> <span class="text-lg font-bold text-slate-200">${currencyTotals[cur].toLocaleString('zh-HK')}</span>`)
                    .join('<span class="mx-2 text-slate-600 text-sm">|</span>') || '<span class="text-slate-500">-</span>';
                document.getElementById("summaryAmount").innerHTML = amountHtml;
                const profitHtml = sortedCurrencies
                    .map(cur => `<span class="text-xs font-medium text-slate-500">${cur}</span> <span class="text-lg font-bold text-slate-200">${currencyProfits[cur].toLocaleString('zh-HK')}</span>`)
                    .join('<span class="mx-2 text-slate-600 text-sm">|</span>') || '<span class="text-slate-500">-</span>';
                document.getElementById("summaryProfit").innerHTML = profitHtml;

                if (allTransactions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="11" class="px-6 py-14">${renderEmptyState("暫無交易記錄", date ? `於 ${date} 沒有找到交易數據` : "今日尚無交易")}</td></tr>`;
                    return;
                }

                renderPage(0);

            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="10" class="px-6 py-14 text-center text-red-500 text-sm">載入失敗，請稍後重試</td></tr>';
                console.error("加載交易記錄失敗：", error);
            }
        }

        function renderPage(page) {
            const tableBody = document.getElementById("transactionTable");
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allTransactions.length);
            const pageTx = allTransactions.slice(start, end);

            tableBody.innerHTML = "";
            pageTx.forEach((tx, i) => {
                const row = document.createElement("tr");
                row.className = "table-row animate-fade-in";
                row.style.animationDelay = `${i * 0.03}s`;
                row.innerHTML = `
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm text-slate-400">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 rounded-full bg-blue-400 shrink-0"></div>
                            ${utcToHKTime(tx.timestamp)}
                        </div>
                    </td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm text-slate-400">${tx.agent_name}</td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm font-semibold text-slate-200">${tx.customer_name || "-"}</td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm">${renderMatchedOrder(tx)}</td>
                    <td class="px-6 py-3.5 text-sm text-center" style="min-width:140px">${renderExchangeWithConversion(tx)}</td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm font-bold text-amber-400 text-right">
                        ${formatCurrency(tx.amount, tx.currency || 'USD')}
                    </td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm font-semibold text-amber-400 text-right">${tx.profit != null ? formatCurrency(tx.profit, tx.currency || 'USD') : '<span class="text-slate-600">未計算</span>'}</td>
                    <td class="px-6 py-3.5 text-sm text-slate-400 max-w-[120px] truncate" title="${escapeHtml(tx.remarks || '')}">${tx.remarks || "-"}</td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm text-slate-300">${tx.insured_person || "-"}</td>
                    <td class="px-6 py-3.5 text-sm text-center" style="min-width:100px">
                        <span class="inline-flex items-center gap-1 bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg text-xs font-medium">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            ${tx.source}
                        </span>
                        ${(() => { const d = renderPaymentDetails(tx.payment_details); return d ? `<details class="mt-1 text-left"><summary class="cursor-pointer text-[10px] text-slate-500 hover:text-slate-300 select-none">詳情</summary><div class="mt-1">${d}</div></details>` : ''; })()}
                    </td>
                    <td class="px-6 py-3.5 whitespace-nowrap text-sm text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button onclick="editTx(${tx.id})" class="text-blue-400 hover:text-amber-400 hover:bg-amber-500/10 px-2 py-1 rounded-lg transition-colors" title="編輯此交易">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteTx(${tx.id})" class="text-red-400 hover:text-red-400 hover:bg-red-500/10 px-2 py-1 rounded-lg transition-colors" title="刪除此交易">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // 更新分頁
            const totalPages = Math.ceil(allTransactions.length / PAGE_SIZE);
            const pagination = document.getElementById("pagination");
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn = document.getElementById("prevPage");
            const nextBtn = document.getElementById("nextPage");

            if (totalPages > 1) {
                pagination.classList.remove("hidden");
                pageInfo.textContent = `第 ${page + 1} 頁，共 ${totalPages} 頁（${allTransactions.length} 筆）`;
                prevBtn.disabled = page === 0;
                nextBtn.disabled = page >= totalPages - 1;
                prevBtn.onclick = () => { if (page > 0) renderPage(page - 1); };
                nextBtn.onclick = () => { if (page < totalPages - 1) renderPage(page + 1); };
            } else {
                pagination.classList.add("hidden");
            }
        }
        // ═══════════════════════════════════════
        //  編輯交易功能
        // ═══════════════════════════════════════

        function validateSwiftFormat(swift) {
            const v = swift.trim();
            if (!v) return { valid: true, error: null };  // 空值不報錯
            if (/^[A-Za-z]{4}[A-Za-z]{2}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(v)) {
                return { valid: true, error: null };
            }
            if (/[一-鿿　-〿＀-￯：:，,、。]/.test(v)) return { valid: false, error: "含非英文字元（可能缺少換行）" };
            if (v.includes(' ')) return { valid: false, error: "含空格（可能合併了多個欄位）" };
            if (v.length < 8 || v.length > 11) return { valid: false, error: `長度異常（${v.length} 字元，應為 8 或 11 位）` };
            if (/[^A-Za-z0-9]/.test(v)) return { valid: false, error: "含非法字元（僅允許英數字）" };
            return { valid: false, error: "格式不正確（應為 8 或 11 位英數字）" };
        }

        function validateBankCodeFormat(code) {
            const v = code.trim();
            if (!v) return { valid: true, error: null };
            if (/^\d{3}$/.test(v)) return { valid: true, error: null };
            return { valid: false, error: "銀行代碼應為 3 位數字" };
        }

        function editTx(id) {
            const tx = allTransactions.find(t => t.id === id);
            if (!tx) return showToast("找不到該筆交易", "error");

            document.getElementById("editTxId").value = tx.id;
            document.getElementById("editAgentName").value = tx.agent_name;
            document.getElementById("editCustomerName").value = tx.customer_name || "";
            document.getElementById("editFromCurrency").value = tx.from_currency || "";
            document.getElementById("editToCurrency").value = tx.to_currency || "";
            document.getElementById("editRemarks").value = tx.remarks || "";
            document.getElementById("editInsuredPerson").value = tx.insured_person || "";
            document.getElementById("editAmount").value = tx.amount;
            document.getElementById("editCurrency").value = (tx.currency || "USD").toUpperCase();

            // 解析 payment_details JSON
            let pd = {};
            try {
                pd = typeof tx.payment_details === "string" ? JSON.parse(tx.payment_details) : (tx.payment_details || {});
            } catch (e) { pd = {}; }

            document.getElementById("editSwift").value = pd.swift || "";
            document.getElementById("editBankName").value = pd.bank_name || "";
            document.getElementById("editBankAddress").value = pd.bank_address || "";
            document.getElementById("editBankCode").value = pd.bank_code || "";
            document.getElementById("editAccountNumber").value = pd.account_number || "";
            document.getElementById("editAccountName").value = pd.account_name || "";

            // 換匯信息
            if (pd.conversion) {
                document.getElementById("editConversionSourceAmount").value = pd.conversion.source_amount || "";
                document.getElementById("editConversionRate").value = pd.conversion.rate || "";
                document.getElementById("editConversionSourceCurrency").value = pd.conversion.source_currency || "";
            } else {
                document.getElementById("editConversionSourceAmount").value = "";
                document.getElementById("editConversionRate").value = "";
                document.getElementById("editConversionSourceCurrency").value = "";
            }

            // 訂單匹配區塊
            updateOrderMatchSection(tx);

            // 即時驗證 SWIFT / 銀行代碼
            updateSwiftStatus();
            updateBankCodeStatus();

            document.getElementById("editValidationErrors").classList.add("hidden");
            document.getElementById("editValidationErrors").innerHTML = "";
            document.getElementById("editModal").classList.add("flex");
            document.getElementById("editModal").classList.remove("hidden");
        }

        function closeEditModal() {
            document.getElementById("editModal").classList.add("hidden");
            document.getElementById("editModal").classList.remove("flex");
        }

        function updateOrderMatchSection(tx) {
            const statusEl = document.getElementById("orderMatchStatus");
            const actionsEl = document.getElementById("orderMatchActions");
            const selectEl = document.getElementById("orderMatchSelect");
            const unmatchBtn = document.getElementById("unmatchOrderBtn");

            if (tx.matched_order) {
                const mo = tx.matched_order;
                statusEl.innerHTML = `<span class="text-emerald-400">已匹配：</span><span class="text-slate-200">${escapeHtml(mo.customer_name)} ¥${mo.amount.toLocaleString()}</span>`;
                actionsEl.style.display = "none";
                unmatchBtn.style.display = "inline-block";
                unmatchBtn.setAttribute("data-order-id", mo.id);
            } else {
                statusEl.textContent = "尚未匹配訂單";
                unmatchBtn.style.display = "none";
                // 填充未匹配的訂單選項
                const unmatched = currentOrders.filter(o => !o.matched_transaction_id);
                if (unmatched.length > 0) {
                    actionsEl.style.display = "flex";
                    selectEl.innerHTML = '<option value="">選擇訂單...</option>' +
                        unmatched.map(o => `<option value="${o.id}">${escapeHtml(o.customer_name)} ¥${o.amount.toLocaleString()}</option>`).join("");
                } else {
                    actionsEl.style.display = "none";
                }
            }
        }

        async function matchOrderToTx() {
            const txId = parseInt(document.getElementById("editTxId").value);
            const orderId = parseInt(document.getElementById("orderMatchSelect").value);
            if (!orderId) return showToast("請選擇一個訂單", "error");
            try {
                await apiRequest(`/orders/${orderId}/match`, "PUT", { transaction_id: txId });
                showToast("訂單匹配成功", "success");
                closeEditModal();
                await loadTransactions();
            } catch (e) {
                showToast("匹配失敗：" + (e.message || e), "error");
            }
        }

        async function unmatchOrderFromTx() {
            const orderId = parseInt(document.getElementById("unmatchOrderBtn").getAttribute("data-order-id"));
            if (!orderId) return;
            try {
                await apiRequest(`/orders/${orderId}/unmatch`, "PUT");
                showToast("已取消匹配", "success");
                closeEditModal();
                await loadTransactions();
            } catch (e) {
                showToast("取消匹配失敗：" + (e.message || e), "error");
            }
        }

        function updateSwiftStatus() {
            const swift = document.getElementById("editSwift").value;
            const status = document.getElementById("swiftStatus");
            if (!swift.trim()) { status.textContent = ""; return; }
            const { valid, error } = validateSwiftFormat(swift);
            if (valid) {
                status.innerHTML = '<span class="text-emerald-500">✓</span>';
            } else {
                status.innerHTML = `<span class="text-red-500" title="${error}">✗ ${error}</span>`;
            }
        }

        function updateBankCodeStatus() {
            const code = document.getElementById("editBankCode").value;
            const status = document.getElementById("bankCodeStatus");
            if (!code.trim()) { status.textContent = ""; return; }
            const { valid, error } = validateBankCodeFormat(code);
            if (valid) {
                status.innerHTML = '<span class="text-emerald-500">✓</span>';
            } else {
                status.innerHTML = `<span class="text-red-500" title="${error}">✗ ${error}</span>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("editSwift").addEventListener("input", updateSwiftStatus);
            document.getElementById("editBankCode").addEventListener("input", updateBankCodeStatus);
        });

        // 點擊背景關閉彈窗
        document.getElementById("editModal").addEventListener("click", function(e) {
            if (e.target === this) closeEditModal();
        });

        document.getElementById("editForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const errors = [];
            const id = document.getElementById("editTxId").value;
            const agentName = document.getElementById("editAgentName").value.trim();
            const customerName = document.getElementById("editCustomerName").value.trim();
            const amount = parseInt(document.getElementById("editAmount").value);
            const currency = document.getElementById("editCurrency").value;
            const fromCurrency = document.getElementById("editFromCurrency").value;
            const toCurrency = document.getElementById("editToCurrency").value;
            const remarks = document.getElementById("editRemarks").value.trim();
            const insuredPerson = document.getElementById("editInsuredPerson").value.trim();
            const swift = document.getElementById("editSwift").value.trim();
            const bankCode = document.getElementById("editBankCode").value.trim();
            const bankName = document.getElementById("editBankName").value.trim();
            const bankAddress = document.getElementById("editBankAddress").value.trim();
            const accountNumber = document.getElementById("editAccountNumber").value.trim();
            const accountName = document.getElementById("editAccountName").value.trim();
            const convSourceAmount = parseFloat(document.getElementById("editConversionSourceAmount").value) || null;
            const convRate = parseFloat(document.getElementById("editConversionRate").value) || null;
            const convSourceCurrency = document.getElementById("editConversionSourceCurrency").value;

            if (!agentName) errors.push("代理名稱不能為空");
            if (!amount || amount <= 0) errors.push("交易金額必須為正整數");
            if (!currency) errors.push("請選擇貨幣");

            // 驗證 SWIFT 格式
            if (swift) {
                const sv = validateSwiftFormat(swift);
                if (!sv.valid) errors.push(`SWIFT 代碼：${sv.error}`);
            }
            // 驗證銀行代碼格式
            if (bankCode) {
                const bc = validateBankCodeFormat(bankCode);
                if (!bc.valid) errors.push(`銀行代碼：${bc.error}`);
            }

            const errorDiv = document.getElementById("editValidationErrors");
            if (errors.length > 0) {
                errorDiv.classList.remove("hidden");
                errorDiv.innerHTML = errors.map(e => `<div>• ${escapeHtml(e)}</div>`).join("");
                return;
            }
            errorDiv.classList.add("hidden");

            // 構建 payment_details（含換匯信息）
            const paymentDetails = { swift, bank_name: bankName, bank_code: bankCode, bank_address: bankAddress, account_number: accountNumber, account_name: accountName };
            if (convSourceAmount || convRate || convSourceCurrency) {
                // 保留原有的 conversion 字段中未編輯的部分（如 matched, daily_rate, autocorrected）
                let existingConv = {};
                try {
                    const origTx = allTransactions.find(t => t.id == id);
                    if (origTx && origTx.payment_details) {
                        const origPd = typeof origTx.payment_details === "string" ? JSON.parse(origTx.payment_details) : origTx.payment_details;
                        if (origPd.conversion) existingConv = origPd.conversion;
                    }
                } catch (e) {}
                paymentDetails.conversion = {
                    source_amount: convSourceAmount || existingConv.source_amount || 0,
                    rate: convRate || existingConv.rate || 0,
                    source_currency: convSourceCurrency || existingConv.source_currency || "CNY",
                    matched: existingConv.matched || false,
                    daily_rate: existingConv.daily_rate || null,
                    autocorrected: existingConv.autocorrected || false,
                };
            }

            const saveBtn = document.getElementById("saveEditBtn");
            saveBtn.disabled = true;
            saveBtn.textContent = "保存中...";

            try {
                await apiRequest(`/transactions/${id}`, "PUT", {
                    agent_name: agentName,
                    customer_name: customerName,
                    amount: amount,
                    currency: currency,
                    from_currency: fromCurrency,
                    to_currency: toCurrency,
                    remarks: remarks,
                    insured_person: insuredPerson,
                    payment_details: JSON.stringify(paymentDetails)
                });
                showToast("交易記錄已更新", "success");
                closeEditModal();
                await loadTransactions();
            } catch (error) {
                showToast("更新失敗：" + (error.message || "請稍後重試"), "error");
                console.error("編輯交易失敗：", error);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "保存修改";
            }
        });

        async function deleteTx(id) {
            if (!confirm("確定要刪除此筆交易記錄嗎？此操作無法復原。")) return;

            try {
                await apiRequest(`/transactions/${id}`, "DELETE");
                showToast("success", "交易記錄已刪除");
                await loadTransactions();
            } catch (error) {
                showToast("error", "刪除失敗，請稍後重試");
                console.error("刪除交易失敗：", error);
            }
        }
    </script>
</body>
</html>
